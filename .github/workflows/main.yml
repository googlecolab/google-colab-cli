name: v1rtu4lyz1um Colab-CLI & Runtime CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *' # Tägliche dezentrale Mesh-Simulation

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Repositorium auschecken
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: System-Abhängigkeiten installieren (CMake & Ninja)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential libffi-dev

    - name: Python-Umgebung einrichten
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Python- & Qiskit-Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install qiskit metakernel cffi ipywidgets cherrypy

    - name: CMake & Ninja Build-Test (C-Kerne / VRAM)
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel $(nproc)

    - name: Metakernel & Qiskit Runtime-Validierung
      run: |
        echo "[CI] Führe dezentrale Colab-Metakernel und Qiskit-Tests aus..."
        python -c "import qiskit; print('Qiskit Version:', qiskit.__version__); print('Mesh-Runtime-Check: OK')"
