name: SSH compatibility

on:
  push:
    paths:
      - "src/colab_cli/**"
      - "tests/test_ssh*.py"
      - "tests/test_windows_ssh.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ssh-compatibility.yml"
  pull_request:
    paths:
      - "src/colab_cli/**"
      - "tests/test_ssh*.py"
      - "tests/test_windows_ssh.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ssh-compatibility.yml"

permissions:
  contents: read

jobs:
  ssh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: ssh -V
      - run: uv run pytest tests/test_ssh.py tests/test_ssh_autocreate.py tests/test_ssh_lifecycle.py tests/test_ssh_wire_contract.py tests/test_ssh_workdir.py tests/test_windows_ssh.py
